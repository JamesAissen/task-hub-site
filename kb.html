<style>
  :root{
    --bg:#070b12; --panel:#0e1622; --panel2:#111d2e; --line:#1d2c40;
    --text:#dbe7f5; --muted:#7f93ac; --cyan:#F77E3B; --cyan-dim:#A65A30; --data:#39d3ff;
    --amber:#ffce54; --green:#3ddc97; --red:#ff6b6b; --glow:0 0 18px rgba(242,94,13,.28);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:radial-gradient(1200px 700px at 70% -10%, #10233a 0%, var(--bg) 55%);
    color:var(--text);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;padding:26px 22px 80px;}
  a{color:var(--cyan);text-decoration:none;}
  .wrap{max-width:1180px;margin:0 auto;visibility:hidden;}
  body.authed .wrap{visibility:visible;}
  header{display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
  .brand{font-size:13px;letter-spacing:4px;color:var(--cyan);text-transform:uppercase;font-weight:600;}
  h1{margin:6px 0 2px;font-size:30px;font-weight:600;letter-spacing:.5px;}
  #sync-pill{font-size:12px;letter-spacing:1px;margin-top:6px;color:var(--muted);}
  .nav{display:flex;gap:8px;flex-wrap:wrap;}
  .nav a{border:1px solid var(--cyan-dim);border-radius:9px;padding:9px 15px;font-size:14px;font-weight:600;}
  .nav a:hover{border-color:var(--cyan);box-shadow:var(--glow);}
  .nav a.on{background:rgba(247,126,59,.14);}

  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .stat{flex:1;min-width:130px;background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .stat .n{font-size:26px;font-weight:700;color:var(--data);}
  .stat .k{color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:2px;}

  .addbox{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:14px;padding:14px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;}
  .addbox input{background:#0a1420;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
    color:var(--text);font-size:14px;font-family:inherit;}
  .addbox input.title{flex:2;min-width:190px;}
  .addbox input.url{flex:3;min-width:240px;}
  .addbox input.tag{flex:1;min-width:130px;}
  .addbox button{background:var(--cyan);border:none;border-radius:8px;color:#061019;font-weight:700;
    padding:10px 20px;cursor:pointer;font-size:14px;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
  #q{flex:1;min-width:200px;background:#0a1420;border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;color:var(--text);font-size:14px;font-family:inherit;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;
    color:var(--muted);cursor:pointer;background:transparent;font-family:inherit;}
  .chip:hover{border-color:var(--cyan);color:var(--cyan);}
  .chip.on{border-color:var(--cyan);color:var(--cyan);background:rgba(247,126,59,.14);}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  @media(max-width:900px){.grid{grid-template-columns:1fr;}}
  .kb{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:13px;padding:14px;}
  .kb .t{font-size:16px;font-weight:600;line-height:1.3;}
  .kb .t a{color:var(--text);}
  .kb .t a:hover{color:var(--cyan);}
  .kb .host{color:var(--data);font-size:12px;margin-top:3px;word-break:break-all;}
  .kb .note{color:var(--muted);font-size:13px;margin-top:8px;line-height:1.5;white-space:pre-wrap;}
  .kb .row{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap;}
  .tag{font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:5px;
    border:1px solid var(--line);color:var(--muted);cursor:pointer;}
  .tag:hover{border-color:var(--cyan);color:var(--cyan);}
  .mv{margin-left:auto;display:flex;gap:6px;}
  .mv button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:7px;
    width:30px;height:28px;cursor:pointer;font-size:13px;line-height:1;font-family:inherit;}
  .mv button:hover{border-color:var(--cyan);color:var(--cyan);}
  .mv button.del:hover{border-color:var(--red);color:var(--red);}
  .empty{color:#4d5f78;font-size:13px;padding:14px 4px;grid-column:1/-1;}
  .eform input,.eform textarea{width:100%;background:#08111c;border:1px solid var(--cyan-dim);
    border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;margin-bottom:7px;font-family:inherit;}
  .eform textarea{min-height:76px;resize:vertical;}
  .eform .btns{display:flex;gap:7px;}
  .eform .save{background:var(--green);border:none;border-radius:8px;color:#061019;font-weight:700;
    padding:7px 14px;cursor:pointer;font-family:inherit;}
  .eform .cancel{background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--muted);
    padding:7px 12px;cursor:pointer;font-family:inherit;}
  footer{margin-top:28px;text-align:center;color:#4d5f78;font-size:12px;letter-spacing:1px;}
  #sign-out{color:#4d5f78;text-decoration:underline;cursor:pointer;}

  #login-ov{position:fixed;inset:0;background:#05080e;display:none;align-items:center;justify-content:center;z-index:50;}
  .login-box{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:16px;padding:28px;width:min(360px,92vw);box-shadow:0 12px 48px rgba(0,0,0,.6);}
  .login-box .lb-title{font-size:20px;font-weight:600;margin-bottom:4px;}
  .login-box .lb-sub{color:var(--muted);font-size:13px;margin-bottom:16px;}
  .login-box input{width:100%;background:#0a1420;border:1px solid var(--line);border-radius:8px;
    padding:11px 12px;color:var(--text);font-size:14px;margin-bottom:10px;}
  #lg-err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:6px;}
  #lg-btn{width:100%;background:var(--cyan);border:none;border-radius:8px;color:#061019;font-weight:700;
    padding:11px;cursor:pointer;font-size:15px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">Knowledge Base</div>
      <h1>References &amp; How-To</h1>
      <div id="sync-pill">&#9679; Connecting&hellip;</div>
    </div>
    <div class="nav">
      <a href="./">Daily Brief</a>
      <a href="tasks.html">Task Hub</a>
      <a href="orders.html">Orders</a>
      <a href="calendar.html">Calendar</a>
      <a href="roadmap.html">Roadmap</a>
      <a class="on" href="#">Knowledge</a>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="n" id="s-total">0</div><div class="k">Entries</div></div>
    <div class="stat"><div class="n" id="s-tags">0</div><div class="k">Tags</div></div>
    <div class="stat"><div class="n" id="s-shown">0</div><div class="k">Showing</div></div>

  <div class="addbox">

    <div class="lb-title">Sign in</div>

    <div id="lg-err"></div>

<script>
const KKEY = "cst_kb_v1";
const CST_AUTH = "cst_auth_v1";
const FB = Object.assign({
  apiKey: "AIzaSyD6jPGiiJdC4pjC079dH9gG0B6rlM0vBD4",
  authUrl: "https://identitytoolkit.googleapis.com/v1",
  tokenUrl: "https://securetoken.googleapis.com/v1",
  dbUrl: "https://james-task-hub-default-rtdb.firebaseio.com",
  email: ""
}, window.CST_TEST_ENDPOINTS || {});

// Seeds are added once each, tracked by id, so deleting one does not bring it back.
const SEED_KB = [
  { id: "kb-dpa-stereo",
    title: "DPA: stereo recording techniques and setups",
    url: "https://www.dpamicrophones.com/mic-university/audio-production/stereo-recording-techniques-and-setups/",

  { id: "kb-companion",

  { id: "kb-piano-tuning",
    title: "Piano tuning: pin setting and treble technique",

    tags: ["piano", "tuning", "reference"],
    note: [
      "Hammer at 12 o clock, handle away, so uncontrolled flagpoling is at right angles to pin movement.",
      "Jerking impulses beat steady pressure. Approach from below. Flex and turn together so pitch tracks rotation.",

      "Hard test blow decides whether a tuning holds. The app cannot see torsion in an unset pin.",
      "Bass: C1 wants 15 to 20 cents flat on a short upright. That is stretch. Trust the beat over the meter.",
      "Treble: one tick can move 100 cents, so flex rather than turn for small moves, and tune to the octave below.",
      "Full working version in Assistant Context Business piano-tuning-field-sheet.md."
    ].join(String.fromCharCode(10)),
    created: "2026-10-04" }
];

const todayStr = new Date().toLocaleDateString("sv-SE");

function norm(s){
  if (!s || typeof s !== "object") return null;
  const items = Array.isArray(s.items) ? s.items : Object.values(s.items || {});
  return { items: items.filter(Boolean), seeded: s.seeded || {}, deleted: s.deleted || {} };
}
function loadLocal(){
  let s; try { s = norm(JSON.parse(localStorage.getItem(KKEY))); } catch(e){ s = null; }
  if (!s) s = { items: [], seeded: {}, deleted: {} };
  let changed = false;
  const have = new Set(s.items.map(o => o.id));
  SEED_KB.forEach(o => {
    if (!s.seeded[o.id]) { s.seeded[o.id] = true; changed = true;
      if (!have.has(o.id) && !s.deleted[o.id]) s.items.push(JSON.parse(JSON.stringify(o))); }
  });
  if (changed) localStorage.setItem(KKEY, JSON.stringify(s));
  return s;
}
function merge(a, b){
  a = norm(a); b = norm(b);
  if (!a) return b; if (!b) return a;
  const out = { items: [], seeded: Object.assign({}, a.seeded, b.seeded),
                deleted: Object.assign({}, a.deleted, b.deleted) };
  const by = {};
  [].concat(a.items, b.items).forEach(o => {
    if (out.deleted[o.id]) return;
    const p = by[o.id];
    if (!p || (o.updatedAt || "") > (p.updatedAt || "")) by[o.id] = o;
  });
  out.items = Object.values(by);
  return out;
}

let session = { idToken:null, uid:null, exp:0 }, syncTimer=null, retryTimer=null;
async function fbSignIn(email, pw){
  const r = await fetch(FB.authUrl + "/accounts:signInWithPassword?key=" + FB.apiKey,
    { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({email:email, password:pw, returnSecureToken:true}) });
  const d = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error((d.error && d.error.message) || "SIGN_IN_FAILED");
  session = { idToken:d.idToken, uid:d.localId, exp: Date.now() + (parseInt(d.expiresIn||"3600",10)-300)*1000 };
  localStorage.setItem(CST_AUTH, JSON.stringify({refreshToken:d.refreshToken, uid:d.localId, email:email}));
  return session;
}
async function fbRefresh(){
  let a; try { a = JSON.parse(localStorage.getItem(CST_AUTH)); } catch(e){ a = null; }
  if (!a || !a.refreshToken) return null;
  let r, d;
  try {
    r = await fetch(FB.tokenUrl + "/token?key=" + FB.apiKey, { method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:"grant_type=refresh_token&refresh_token=" + encodeURIComponent(a.refreshToken) });
    d = await r.json();
  } catch(e){ throw new Error("NETWORK"); }
  if (!r.ok) {
    const m = (d && d.error && d.error.message) || "";
    if (/TOKEN|USER_DISABLED|USER_NOT_FOUND/.test(m)) localStorage.removeItem(CST_AUTH);
    return null;
  }
  session = { idToken:d.id_token, uid:d.user_id, exp: Date.now() + (parseInt(d.expires_in||"3600",10)-300)*1000 };
  a.refreshToken = d.refresh_token || a.refreshToken;
  localStorage.setItem(CST_AUTH, JSON.stringify(a));
  return session;
}
async function fbToken(){
  if (session.idToken && Date.now() < session.exp) return session.idToken;
  const s = await fbRefresh(); return s ? s.idToken : null;
}
async function cloudGet(){
  const tk = await fbToken(); if (!tk) return undefined;
  const r = await fetch(FB.dbUrl + "/users/" + session.uid + "/kb.json?auth=" + tk);
  if (!r.ok) throw new Error("DB_" + r.status);
  return await r.json();
}
async function cloudPut(s){
  const tk = await fbToken(); if (!tk) return false;
  const r = await fetch(FB.dbUrl + "/users/" + session.uid + "/kb.json?auth=" + tk,
    { method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify(s) });
  return r.ok;
}
function setSync(state){
  const el = document.getElementById("sync-pill"); if (!el) return;
  const map = { synced:["● Synced","#3ddc97"], syncing:["● Syncing…","#ffce54"],
                offline:["● Offline — saved locally","#ffce54"],
                signedout:["● Not signed in","#ff6b6b"] };
  const m = map[state] || map.offline; el.textContent = m[0]; el.style.color = m[1];
}
function save(){ localStorage.setItem(KKEY, JSON.stringify(store)); clearTimeout(syncTimer); syncTimer = setTimeout(push, 800); }
async function push(){
  if (!localStorage.getItem(CST_AUTH)) return;
  setSync("syncing");
  try { const ok = await cloudPut(JSON.parse(localStorage.getItem(KKEY)));
    setSync(ok ? "synced" : "signedout"); if (!ok) showLogin();
  } catch(e){ setSync("offline"); clearTimeout(retryTimer); retryTimer = setTimeout(push, 60000); }
}
async function initSync(){
  if (!localStorage.getItem(CST_AUTH)) { document.body.classList.remove("authed"); setSync("signedout"); showLogin(); return; }
  document.body.classList.add("authed");
  setSync("syncing");
  try {
    const tk = await fbToken();
    if (!tk) { document.body.classList.remove("authed"); setSync("signedout"); showLogin(); return; }
    const merged = merge(await cloudGet(), loadLocal());
    localStorage.setItem(KKEY, JSON.stringify(merged));
    store = merged;
    await cloudPut(merged);
    setSync("synced"); render();
  } catch(e){ setSync("offline"); clearTimeout(retryTimer); retryTimer = setTimeout(initSync, 60000); }
}
function showLogin(){
  const ov = document.getElementById("login-ov"); if (!ov) return;
  let a; try { a = JSON.parse(localStorage.getItem(CST_AUTH)); } catch(e){}
  document.getElementById("lg-email").value = (a && a.email) || FB.email;
  document.getElementById("lg-err").textContent = "";
  ov.style.display = "flex";
}
function wireLogin(){
  const ov = document.getElementById("login-ov"), err = document.getElementById("lg-err");
  async function go(){
    err.textContent = "";
    const email = document.getElementById("lg-email").value.trim(), pw = document.getElementById("lg-pw").value;
    if (!email || !pw) { err.textContent = "Enter your email and password."; return; }
    document.getElementById("lg-btn").disabled = true;
    try { await fbSignIn(email, pw); document.body.classList.add("authed");
      ov.style.display = "none"; document.getElementById("lg-pw").value = ""; initSync();
    } catch(e){
      const m = { EMAIL_NOT_FOUND:"No account with that email.", INVALID_PASSWORD:"Wrong password.",
                  INVALID_LOGIN_CREDENTIALS:"Wrong email or password.",
                  TOO_MANY_ATTEMPTS_TRY_LATER:"Too many tries — wait a minute." };
      err.textContent = m[e.message] || ("Couldn’t sign in (" + e.message + ")");
    } finally { document.getElementById("lg-btn").disabled = false; }
  }
  document.getElementById("lg-btn").addEventListener("click", go);
  document.getElementById("lg-pw").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  document.getElementById("sign-out").addEventListener("click", e => {
    e.preventDefault();
    if (!confirm("Sign out and remove this data from this browser? It stays safe in your cloud database.")) return;
    localStorage.removeItem(CST_AUTH); localStorage.removeItem(KKEY);
    session = { idToken:null, uid:null, exp:0 }; store = { items:[], seeded:{}, deleted:{} };
    document.body.classList.remove("authed"); setSync("signedout"); render(); showLogin();
  });
}

let store = loadLocal(), editing = null, filterTag = "", query = "";
function esc(s){ return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Only ever emit http(s) hrefs. An entry could otherwise carry a javascript: URL.
function safeUrl(u){
  try { const p = new URL(u); return (p.protocol === "http:" || p.protocol === "https:") ? p.href : ""; }
  catch(e){ return ""; }
}
function hostOf(u){ try { return new URL(u).hostname.replace(/^www\./, ""); } catch(e){ return ""; } }
function tagsOf(o){ return Array.isArray(o.tags) ? o.tags : (o.tags ? String(o.tags).split(",") : []); }
function cleanTags(s){
  return String(s || "").split(",").map(t => t.trim().toLowerCase()).filter(Boolean).slice(0, 6);
}

function card(o){
  const href = safeUrl(o.url), host = hostOf(o.url);
  const title = esc(o.title || host || "Untitled");
  return '<div class="kb" data-id="' + esc(o.id) + '">' +
    '<div class="t">' + (href ? '<a href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + title + '</a>' : title) + '</div>' +
    (host ? '<div class="host">' + esc(host) + '</div>' : '') +
    (o.note ? '<div class="note">' + esc(o.note) + '</div>' : '') +
    '<div class="row">' +
      tagsOf(o).map(t => '<span class="tag" data-act="tag" data-tag="' + esc(t) + '">' + esc(t) + '</span>').join('') +
      '<span class="mv">' +
        '<button data-act="edit" title="Edit">&#9998;</button>' +
        '<button class="del" data-act="del" title="Delete">&#10005;</button>' +
      '</span>' +
    '</div></div>';
}
function editCard(o){
  return '<div class="kb" data-id="' + esc(o.id) + '"><div class="eform">' +
    '<input class="e-title" value="' + esc(o.title) + '" placeholder="Title">' +
    '<input class="e-url" value="' + esc(o.url) + '" placeholder="https://">' +
    '<input class="e-tags" value="' + esc(tagsOf(o).join(", ")) + '" placeholder="Tags, comma separated">' +
    '<textarea class="e-note" placeholder="Why this is useful, and the bits worth remembering">' + esc(o.note) + '</textarea>' +
    '<div class="btns"><button class="save" data-act="save">Save</button>' +
    '<button class="cancel" data-act="cancel">Cancel</button></div>' +
    '</div></div>';
}

function matches(o){
  if (filterTag && !tagsOf(o).includes(filterTag)) return false;
  if (!query) return true;
  const hay = [o.title, o.note, o.url, tagsOf(o).join(" ")].join(" ").toLowerCase();
  return query.split(/\s+/).every(w => hay.includes(w));
}

function render(){
  const grid = document.getElementById("grid");
  const all = store.items.slice().sort((a, b) =>
    (b.updatedAt || b.created || "").localeCompare(a.updatedAt || a.created || ""));
  const shown = all.filter(matches);

  const tagSet = new Set();
  all.forEach(o => tagsOf(o).forEach(t => tagSet.add(t)));
  const tags = Array.from(tagSet).sort();

  document.getElementById("s-total").textContent = all.length;
  document.getElementById("s-tags").textContent = tags.length;
  document.getElementById("s-shown").textContent = shown.length;

  document.getElementById("chips").innerHTML =
    (tags.length ? '<button class="chip' + (filterTag ? '' : ' on') + '" data-tag="">All</button>' : '') +
    tags.map(t => '<button class="chip' + (filterTag === t ? ' on' : '') + '" data-tag="' + esc(t) + '">' + esc(t) + '</button>').join('');

  grid.innerHTML = shown.length
    ? shown.map(o => (editing === o.id ? editCard(o) : card(o))).join('')
    : '<div class="empty">' + (all.length ? 'Nothing matches that.' : 'Nothing saved yet. Add your first reference above.') + '</div>';
}

document.getElementById("chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  filterTag = c.getAttribute("data-tag") || ""; render();
});
document.getElementById("q").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase(); render();
});

document.getElementById("grid").addEventListener("click", e => {
  const btn = e.target.closest("[data-act]"); if (!btn) return;
  const act = btn.getAttribute("data-act");
  if (act === "tag") { filterTag = btn.getAttribute("data-tag") || ""; render(); return; }
  const el = e.target.closest(".kb"); if (!el) return;
  const o = store.items.find(x => x.id === el.getAttribute("data-id")); if (!o) return;
  const stamp = () => { o.updatedAt = new Date().toISOString(); };
  if (act === "edit") { editing = o.id; render(); }
  else if (act === "cancel") { editing = null; render(); }
  else if (act === "del") {
    if (confirm("Delete this reference?\n\n" + (o.title || o.url))) {
      store.items = store.items.filter(x => x.id !== o.id);
      store.deleted = store.deleted || {}; store.deleted[o.id] = new Date().toISOString();
      editing = null; save(); render();
    }
  }
  else if (act === "save") {
    o.title = el.querySelector(".e-title").value.trim() || o.title;
    o.url   = el.querySelector(".e-url").value.trim();
    o.tags  = cleanTags(el.querySelector(".e-tags").value);
    o.note  = el.querySelector(".e-note").value.trim();
    stamp(); editing = null; save(); render();
  }
});

function addEntry(){
  const t = document.getElementById("a-title"), u = document.getElementById("a-url"),
        g = document.getElementById("a-tag");
  const url = u.value.trim();
  if (!t.value.trim() && !url) { t.focus(); return; }
  store.items.push({
    id: "k" + Math.random().toString(36).slice(2,9),
    title: t.value.trim() || hostOf(url) || "Untitled",
    url: url, tags: cleanTags(g.value), note: "",
    created: todayStr, updatedAt: new Date().toISOString()
  });
  t.value = ""; u.value = ""; g.value = "";
  filterTag = ""; query = ""; document.getElementById("q").value = "";
  save(); render();
}
document.getElementById("a-btn").addEventListener("click", addEntry);
["a-title","a-url","a-tag"].forEach(id => document.getElementById(id)
  .addEventListener("keydown", e => { if (e.key === "Enter") addEntry(); }));
window.addEventListener("storage", e => { if (e.key === KKEY) { store = loadLocal(); render(); } });

wireLogin(); render(); initSync();

  // ---- installable app (hosted only) ----
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
</script>
